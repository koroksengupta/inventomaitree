# CI = "continuous integration": on every push and pull request, check that the
# code still type-checks, passes the linter and builds. A red X on GitHub means
# something broke. It never deploys anything.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
