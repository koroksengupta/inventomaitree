# Builds the app and publishes it to https://koroksengupta.github.io/inventomaitree/
# Runs automatically on every push to `main`, or by hand from the Actions tab.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL       e.g. https://xxxx.supabase.co
#   VITE_SUPABASE_ANON_KEY  the publishable key (NOT the service_role / secret key)
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer one waits for the running one to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Supabase settings come from repository secrets)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      # Only the built `dist` folder is published, not the source code or SQL files.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
